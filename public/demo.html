<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>stroke-rigger — Demo</title>
    <style>
      body { font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; background:#f6fbfb }
      #anim { width: 420px; height: 420px; background: white; border-radius: 12px; display:flex; align-items:center; justify-content:center; box-shadow: 0 8px 30px rgba(15,30,40,0.08) }
    </style>
  </head>
  <body>
    <div id="anim"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.7.13/lottie.min.js"></script>
    <script>
      const animContainer = document.getElementById('anim')
      fetch('/examples/cute-bounce.json').then(r => r.json()).then(data => {
        lottie.loadAnimation({
          container: animContainer,
          renderer: 'svg',
          loop: true,
          autoplay: true,
          animationData: data
        })
      }).catch(err => {
        animContainer.innerText = 'Failed to load animation: ' + err.message
      })
    </script>
  </body>
</html>
